name: Phone Office Release

on:
  push:
    branches:
      - main
    tags:
      - "v*-android-test*"
      - "v0.5.0"
      - "v0.6.0"
      - "v0.7.0"
      - "v0.7.5"
      - "v0.7.6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore test signing identity
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phone-office-debug-signing-v1
      - name: Install dependencies and validate web app
        run: |
          npm ci --no-audit --no-fund
          PHONE_OFFICE_ODF_VALIDATION_DIR="$RUNNER_TEMP/odf-validation" npm test
          npm run build
          npx cap sync android
      - name: Validate phone and tablet editing with browser input
        run: |
          npx playwright install --with-deps chromium
          PHONE_OFFICE_PRODUCTION=1 npm run test:e2e
      - name: Validate OpenDocument exports against ODF 1.3
        run: |
          validator="$RUNNER_TEMP/odfvalidator.jar"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/odftoolkit/odfvalidator/0.13.0/odfvalidator-0.13.0-jar-with-dependencies.jar --output "$validator"
          printf '%s  %s\n' 'df4ac79cea8e57376f940e3de059abe4cce44876' "$validator" | sha1sum --check --status
          java -jar "$validator" "$RUNNER_TEMP/odf-validation/"*.odt "$RUNNER_TEMP/odf-validation/"*.ott
          python3 -m venv "$RUNNER_TEMP/odf-validation-python"
          "$RUNNER_TEMP/odf-validation-python/bin/pip" install lxml==6.1.1
          "$RUNNER_TEMP/odf-validation-python/bin/python" scripts/validate-odf.py "$validator" "$RUNNER_TEMP/odf-validation"
      - name: Prepare verified Android SDK
        run: |
          sdk_dir="$RUNNER_TEMP/phone-office-android-sdk"
          archive="$RUNNER_TEMP/android-commandline-tools.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip --output "$archive"
          printf '%s  %s\n' '5fdcc763663eefb86a5b8879697aa6088b041e70' "$archive" | sha1sum --check --status
          mkdir -p "$sdk_dir/cmdline-tools"
          unzip -q "$archive" -d "$RUNNER_TEMP/android-commandline-tools"
          mv "$RUNNER_TEMP/android-commandline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          python3 -c 'print("y\n" * 100)' > "$RUNNER_TEMP/android-license-input"
          "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_dir" --licenses < "$RUNNER_TEMP/android-license-input" > "$RUNNER_TEMP/android-license-output"
          "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_dir" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_dir" "$sdk_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_dir/cmdline-tools/latest/bin" "$sdk_dir/platform-tools" >> "$GITHUB_PATH"
      - name: Select explicit cached test signing key
        run: |
          key_store="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$key_store" ]; then
            keytool -genkeypair -keystore "$key_store" -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          printf 'PHONE_OFFICE_DEBUG_KEYSTORE=%s\n' "$key_store" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$key_store" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/android-test-certificate.der"
          sha256sum "$RUNNER_TEMP/android-test-certificate.der"
      - name: Assemble signed release APK
        env:
          PHONE_OFFICE_VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: bash gradlew --no-daemon --max-workers=2 assembleRelease
      - name: Verify and package APK
        run: |
          mkdir -p artifacts
          (cd dist && zip -qr ../artifacts/phone-office-web-ipad.zip .)
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/phone-office-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/phone-office-android.apk > artifacts/signature.txt
          expected=$(sha256sum "$RUNNER_TEMP/android-test-certificate.der" | cut -d ' ' -f 1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifacts/signature.txt)
          test "$actual" = "$expected"
          test "$actual" = "aa73f1f19ec9b8428b026a2a6876ce2b8ef019a90d906608b67ca19857906b85"
          printf 'Certificate SHA256: %s\n' "$actual" > artifacts/signing-identity.txt
          printf 'Signing cache restored: %s\n' '${{ steps.signing-cache.outputs.cache-hit }}' >> artifacts/signing-identity.txt
          echo "::notice title=Android test signing identity::$actual; cache restored: ${{ steps.signing-cache.outputs.cache-hit }}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/phone-office-android.apk > artifacts/package-info.txt
          grep "package: name='dev.lyvt.phoneoffice.debug'" artifacts/package-info.txt
          if grep -q 'application-debuggable' artifacts/package-info.txt; then
            echo 'Refusing a debuggable release'
            exit 1
          fi
          grep "application-label:'Phone Office'" artifacts/package-info.txt
          grep "versionName='0.7.6'" artifacts/package-info.txt
          if grep -q 'application-testOnly' artifacts/package-info.txt; then
            echo 'Refusing an APK that requires adb install -t'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree artifacts/phone-office-android.apk AndroidManifest.xml > artifacts/manifest-info.txt
          if grep -q 'android:testOnly' artifacts/manifest-info.txt; then
            echo 'Refusing testOnly manifest flag for file-based installation'
            exit 1
          fi
          cd artifacts
          sha256sum phone-office-android.apk phone-office-web-ipad.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phone-office-android-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  ipad:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Select newest installed Xcode
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re, subprocess
          choices = [(tuple(map(int, re.findall(r'\d+', p.stem))), p) for p in Path('/Applications').glob('Xcode_*.app') if re.fullmatch(r'Xcode_\d+(?:\.\d+)*', p.stem)]
          if choices:
              subprocess.run(['sudo','xcode-select','--switch',str(max(choices)[1] / 'Contents/Developer')], check=True)
          subprocess.run(['xcodebuild','-version'], check=True)
          PYCODE
      - name: Prepare native iPad app
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync ios
      - name: Validate iPad editor with WebKit
        run: |
          npx playwright install webkit
          npx playwright test --config playwright.webkit.config.ts --reporter=list,github
      - name: Compile actual arm64 iPhone and iPad app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/phone-office-ipad" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify and package unsigned IPA for xtool
        run: python3 scripts/package-ios-unsigned.py "$RUNNER_TEMP/phone-office-ipad/Build/Products/Release-iphoneos/App.app" artifacts-ipad
      - uses: actions/upload-artifact@v4
        with:
          name: phone-office-ipad-xtool
          path: artifacts-ipad/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, ipad]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phone-office-android-test
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: phone-office-ipad-xtool
          path: artifacts-ipad
      - name: Publish project release or test prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "v0.7.6" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/phone-office-android.apk artifacts/phone-office-web-ipad.zip artifacts/SHA256SUMS.txt artifacts/signature.txt artifacts/package-info.txt artifacts/signing-identity.txt artifacts-ipad/phone-office-ios-unsigned.ipa artifacts-ipad/SHA256SUMS-ios.txt artifacts-ipad/ios-build-info.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Phone Office 0.7.6" --notes-file docs/RELEASE-0.7.6.md
          elif [ "$GITHUB_REF_NAME" = "v0.7.5" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/phone-office-android.apk artifacts/phone-office-web-ipad.zip artifacts/SHA256SUMS.txt artifacts/signature.txt artifacts/package-info.txt artifacts/signing-identity.txt artifacts-ipad/phone-office-ios-unsigned.ipa artifacts-ipad/SHA256SUMS-ios.txt artifacts-ipad/ios-build-info.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Phone Office 0.7.5" --notes-file docs/RELEASE-0.7.5.md
          elif [ "$GITHUB_REF_NAME" = "v0.7.0" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/phone-office-android.apk artifacts/phone-office-web-ipad.zip artifacts/SHA256SUMS.txt artifacts/signature.txt artifacts/package-info.txt artifacts/signing-identity.txt artifacts-ipad/phone-office-ios-unsigned.ipa artifacts-ipad/SHA256SUMS-ios.txt artifacts-ipad/ios-build-info.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Phone Office 0.7.0" --notes-file docs/RELEASE-0.7.0.md
          elif [ "$GITHUB_REF_NAME" = "v0.6.0" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/phone-office-android.apk artifacts/phone-office-web-ipad.zip artifacts/SHA256SUMS.txt artifacts/signature.txt artifacts/package-info.txt artifacts/signing-identity.txt artifacts-ipad/phone-office-ios-unsigned.ipa artifacts-ipad/SHA256SUMS-ios.txt artifacts-ipad/ios-build-info.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Phone Office 0.6.0" --notes-file docs/RELEASE-0.6.0.md
          elif [ "$GITHUB_REF_NAME" = "v0.5.0" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/phone-office-android.apk artifacts/phone-office-web-ipad.zip artifacts/SHA256SUMS.txt artifacts/signature.txt artifacts/package-info.txt artifacts/signing-identity.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Phone Office 0.5.0" --notes-file docs/RELEASE-0.5.0.md
          else
            gh release create "$GITHUB_REF_NAME" artifacts/phone-office-android.apk artifacts/phone-office-web-ipad.zip artifacts/SHA256SUMS.txt artifacts/signature.txt artifacts/package-info.txt artifacts/signing-identity.txt --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Phone Office Android-Test $GITHUB_REF_NAME" --notes-file docs/ANDROID-TEST-RELEASE.md
          fi
