name: Android Test APK

on:
  push:
    branches:
      - main
    tags:
      - "v*-android-test*"
      - "v0.5.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore test signing identity
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phone-office-debug-signing-v1
      - name: Install dependencies and validate web app
        run: |
          npm ci --no-audit --no-fund
          PHONE_OFFICE_ODF_VALIDATION_DIR="$RUNNER_TEMP/odf-validation" npm test
          npm run build
          npx cap sync android
      - name: Validate phone and tablet editing with browser input
        run: |
          npx playwright install --with-deps chromium
          PHONE_OFFICE_PRODUCTION=1 npm run test:e2e
      - name: Validate OpenDocument exports against ODF 1.3
        run: |
          validator="$RUNNER_TEMP/odfvalidator.jar"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/odftoolkit/odfvalidator/0.13.0/odfvalidator-0.13.0-jar-with-dependencies.jar --output "$validator"
          printf '%s  %s\n' 'df4ac79cea8e57376f940e3de059abe4cce44876' "$validator" | sha1sum --check --status
          java -jar "$validator" "$RUNNER_TEMP/odf-validation/"*.odt "$RUNNER_TEMP/odf-validation/"*.ott
          python3 -m venv "$RUNNER_TEMP/odf-validation-python"
          "$RUNNER_TEMP/odf-validation-python/bin/pip" install lxml==6.1.1
          "$RUNNER_TEMP/odf-validation-python/bin/python" scripts/validate-odf.py "$validator" "$RUNNER_TEMP/odf-validation"
      - name: Prepare verified Android SDK
        run: |
          sdk_dir="$RUNNER_TEMP/phone-office-android-sdk"
          archive="$RUNNER_TEMP/android-commandline-tools.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip --output "$archive"
          printf '%s  %s\n' '5fdcc763663eefb86a5b8879697aa6088b041e70' "$archive" | sha1sum --check --status
          mkdir -p "$sdk_dir/cmdline-tools"
          unzip -q "$archive" -d "$RUNNER_TEMP/android-commandline-tools"
          mv "$RUNNER_TEMP/android-commandline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          python3 -c 'print("y\n" * 100)' > "$RUNNER_TEMP/android-license-input"
          "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_dir" --licenses < "$RUNNER_TEMP/android-license-input" > "$RUNNER_TEMP/android-license-output"
          "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_dir" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_dir" "$sdk_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_dir/cmdline-tools/latest/bin" "$sdk_dir/platform-tools" >> "$GITHUB_PATH"
      - name: Select explicit cached test signing key
        run: |
          key_store="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$key_store" ]; then
            keytool -genkeypair -keystore "$key_store" -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          printf 'PHONE_OFFICE_DEBUG_KEYSTORE=%s\n' "$key_store" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$key_store" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/android-test-certificate.der"
          sha256sum "$RUNNER_TEMP/android-test-certificate.der"
      - name: Assemble signed debug APK
        env:
          PHONE_OFFICE_VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: bash gradlew --no-daemon --max-workers=2 assembleDebug
      - name: Verify and package APK
        run: |
          mkdir -p artifacts
          (cd dist && zip -qr ../artifacts/phone-office-web-ipad.zip .)
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/phone-office-android-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/phone-office-android-test.apk > artifacts/signature.txt
          expected=$(sha256sum "$RUNNER_TEMP/android-test-certificate.der" | cut -d ' ' -f 1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifacts/signature.txt)
          test "$actual" = "$expected"
          printf 'Certificate SHA256: %s\n' "$actual" > artifacts/signing-identity.txt
          printf 'Signing cache restored: %s\n' '${{ steps.signing-cache.outputs.cache-hit }}' >> artifacts/signing-identity.txt
          echo "::notice title=Android test signing identity::$actual; cache restored: ${{ steps.signing-cache.outputs.cache-hit }}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/phone-office-android-test.apk > artifacts/package-info.txt
          grep "package: name='dev.lyvt.phoneoffice.debug'" artifacts/package-info.txt
          grep 'application-debuggable' artifacts/package-info.txt
          if grep -q 'application-testOnly' artifacts/package-info.txt; then
            echo 'Refusing an APK that requires adb install -t'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree artifacts/phone-office-android-test.apk AndroidManifest.xml > artifacts/manifest-info.txt
          if grep -q 'android:testOnly' artifacts/manifest-info.txt; then
            echo 'Refusing testOnly manifest flag for file-based installation'
            exit 1
          fi
          cd artifacts
          sha256sum phone-office-android-test.apk phone-office-web-ipad.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phone-office-android-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phone-office-android-test
          path: artifacts
      - name: Publish project release or test prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "v0.5.0" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/phone-office-android-test.apk artifacts/phone-office-web-ipad.zip artifacts/SHA256SUMS.txt artifacts/signature.txt artifacts/package-info.txt artifacts/signing-identity.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Phone Office 0.5.0" --notes-file docs/RELEASE-0.5.0.md
          else
            gh release create "$GITHUB_REF_NAME" artifacts/phone-office-android-test.apk artifacts/phone-office-web-ipad.zip artifacts/SHA256SUMS.txt artifacts/signature.txt artifacts/package-info.txt artifacts/signing-identity.txt --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Phone Office Android-Test $GITHUB_REF_NAME" --notes-file docs/ANDROID-TEST-RELEASE.md
          fi
